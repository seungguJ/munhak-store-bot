name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Validate data/events.json
        run: python -c "from alert import store; store.validate(store.load_json(store.EVENTS_PATH))"
